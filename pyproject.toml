[project]
name = "legacyai"
version = "0.1.0"
description = "Legacy document ingestion and vector ETL pipeline"
requires-python = ">=3.11"
dependencies = [
    "pymupdf",
    "pandas",
    "chromadb",
    "sentence-transformers",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
legacyai = "legacyai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacyai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]