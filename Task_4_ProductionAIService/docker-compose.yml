services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: production-ai-service:local
    container_name: production-ai-service
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_NAME: production-ai-service
      APP_ENV: production
      LOG_LEVEL: INFO
      AI_PROVIDER: mock
      REQUEST_TIMEOUT_SECONDS: 30
      MAX_REQUEST_SIZE_BYTES: 1048576
      METRICS_ENABLED: "true"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
